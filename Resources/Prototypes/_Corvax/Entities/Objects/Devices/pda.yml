- type: entity
  parent: BasePDA
  id: IAAPDA
  name: internal affairs agent PDA
  description: Corporation and profit are best friends.
  components:
    - type: Pda
      id: IAAIDCard
    - type: PdaBorderColor
      borderColor: "#b83535"
    - type: Sprite
      sprite: Objects/Devices/pda.rsi
      layers:
        - state: "pda-detective"
          map: [ "enum.PdaVisualLayers.Base" ]
        - state: "light_overlay"
          map: [ "enum.PdaVisualLayers.Flashlight" ]
          shader: "unshaded"
          visible: false
        - state: "id_overlay"
          map: [ "enum.PdaVisualLayers.IdLight" ]
          shader: "unshaded"
          visible: false
    - type: Icon
      state: pda-detective
    - type: Appearance
      appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
          pda-detective
