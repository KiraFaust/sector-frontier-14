- type: entity
  id: CameraBug
  parent: [ BaseItem, BaseC3ContrabandNoValue ] # Frontier: BaseSyndicateContraband<BaseC3ContrabandNoValue
  name: camera bug
  description: An illegal syndicate device that allows you to hack into the station's camera network.
  components:
  - type: Sprite
    sprite: Objects/Devices/camera_bug.rsi
    layers:
    - state: camera_bug
  - type: Item
    sprite: Objects/Devices/camera_bug.rsi
  - type: ActivatableUI
    requireActiveHand: false
    inHandsOnly: true
    key: enum.SurveillanceMonitorUiKey.Key # Lua
  - type: UserInterface
    interfaces:
      enum.SurveillanceMonitorUiKey.Key: # Lua
        type: SurveillanceMonitorWindowBoundUserInterface # Lua
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: SurveillanceCamera
    transmitFrequencyId: SurveillanceCamera
  - type: WiredNetworkConnection
  - type: SurveillanceMonitor # Lua
  - type: StaticPrice
    price: 2000
