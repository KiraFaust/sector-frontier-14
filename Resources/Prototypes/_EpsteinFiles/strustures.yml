- type: entity
  id: BluespacePalletTeleporter
  components:
  - type: BluespacePalletTeleporter
    targetPalletPrototype: CargoPalletBuy
    effectPrototype: EffectFlashBluespace
    waitForEffect: true
    whitelistComponents:
      - EntityStorage
  - type: TriggerOnSignal
  - type: ExtensionCableReceiver
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
    - Open
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
