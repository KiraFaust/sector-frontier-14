- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackPathologist
  name: рюкзак патологоанатома
  description: Рюкзак патологоанатома - донеси свою любовь к трупам, не говоря даже слов.
  components:
  - type: Sprite
    sprite: _Lua/Clothing/Back/Backpacks/pathologist.rsi

- type: entity
  parent: ClothingBackpackDuffel
  id: ClothingBackpackDuffelPathologist
  name: вещмешок патологоанатома
  description: Большой вещмешок для хранения дополнительных медицинских припасов.
  components:
    - type: Sprite
      sprite: _Lua/Clothing/Back/Duffels/pathologist.rsi

- type: entity
  parent: ClothingBackpackSatchel
  id: ClothingBackpackSatchelPathologist
  name: сумка патологоанатома
  description: Идеальная сумка, чтобы переносить свои тайны вместе с несколькими косточками в кармане.
  components:
  - type: Sprite
    sprite: _Lua/Clothing/Back/Satchels/pathologist.rsi

- type: entity
  parent: [ClothingBackpack, BaseC1SyndicateContraband]
  id: ClothingBackpackSatchelOutpostSyndicate
  name: сумка синдиката
  description: Модная сумка в красно-чёрных тонах.
  components:
  - type: Storage
    grid:
    - 0,0,1,3
    - 3,0,6,3
    - 8,0,9,3
  - type: Sprite
    sprite: _Lua/Clothing/Back/bag.rsi

- type: entity
  parent: NFClothingDuffel
  id: ClothingBackpackDuffelHoP
  name: hop duffel bag
  description: A large duffel bag made of cloth. Smells like office.
  components:
    - type: Sprite
      sprite: _Lua/Clothing/Back/Duffels/hop.rsi

- type: entity
  parent: ClothingBackpackSatchel
  id: ClothingBackpackSatchelHoP
  name: hop satchel
  description: A satchel with extra pockets for papers!
  components:
  - type: Sprite
    sprite: _Lua/Clothing/Back/Satchels/hop.rsi

- type: entity
  parent: NFClothingBackpack
  id: ClothingBackpackHoP
  name: hop backpack
  description: It's a light backpack for a papers lovers!
  components:
  - type: Sprite
    sprite: _Lua/Clothing/Back/Backpacks/hop.rsi

- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackBrigmedicWhite
  name: белый рюкзак бригмедика
  description: Рюкзак бригмедика в белом формате. На нём вышит значок пульса.
  components:
  - type: Sprite
    sprite: _Lua/Clothing/Back/Backpacks/brigmedic.rsi

- type: entity
  parent: ClothingBackpackSatchel
  id: ClothingBackpackSatchelBrigmedicWhite
  name: белая сумка бригмедика
  description: Сумка ангела хранителя СБ. Вы не можете знать, что в этой сумке содержится теперь, поэтому заглядывать туда не рекомендуется.
  components:
  - type: Sprite
    sprite: _Lua/Clothing/Back/Satchels/brigmedic.rsi

- type: entity
  parent: ClothingBackpackDuffel
  id: ClothingBackpackDuffelBrigmedicWhite
  name: белый вещмешок бригмедика
  description: Большой вещмешок для переноса вещей бригмедика по станции и за её пределами. Определённо точно не предназначен для таскания фелинидов.
  components:
    - type: Sprite
      sprite: _Lua/Clothing/Back/Duffels/brigmedic.rsi
