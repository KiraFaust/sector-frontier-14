#region Civilian


- type: entity
  parent: [ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase, BaseC1Contraband]
  id: ClothingHeadHelmetAriralExosuit
  name: Шлем экзоскафандра Арирал
  description: Как вы это увидели?
  components:
  - type: BreathMask
  - type: Sprite
    sprite: _Lua/Clothing/Head/Hardsuits/ariral.rsi
  - type: Clothing
    sprite: _Lua/Clothing/Head/Hardsuits/ariral.rsi
  - type: RaceRequirement
    allowedRaces:
      - Ariral
  - type: PointLight
    radius: 7
    energy: 3
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.005
    coolingCoefficient: 0.005
  - type: FireProtection
    reduction: 0.2
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
  - type: FlashImmunity
  - type: EyeProtection
  - type: ShowHealthBars
    damageContainers:
    - Biological
    - Inorganic
    - Silicon
  - type: ShowHealthIcons
    damageContainers:
    - Biological

#region Nanotrasen
- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: ClothingHeadHelmetHardsuitCapspaceHelmetReinforced
  categories: [ HideSpawnMenu ]
  name: шлем боевого скафандра капитана
  description: Шлем, защищающий голову элитных капитанов.
  components:
  - type: Armor
    coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.95
        Cold: 0.95
        Caustic: 0.95
        Radiation: 0.85
  - type: Sprite
    sprite: _Lua/Clothing/Head/Hardsuit/capspace_helmet_reinforced.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
    - state: light-overlay
      visible: false
      shader: unshaded
      map: [ "light" ]
  - type: HandheldLight
    addPrefix: false
  - type: ToggleableLightVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: equipped-head-light
        shader: unshaded
      head-vox:
      - state: equipped-head-light-vox
        shader: unshaded
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-head
      - state: equipped-head-unshaded
        shader: unshaded
  - type: PointLight
    color: "#ffaf38"
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.005
    coolingCoefficient: 0.005
  - type: FireProtection
    reduction: 0.2

