- type: job
  id: Investigator
  name: job-name-investigator
  description: job-description-investigator
  playTimeTracker: JobInvestigator
  setPreference: false
  requirements:
  - !type:RoleTimeRequirement
      role: JobWarden
      time: 10800 # 3 hours
  - !type:RoleTimeRequirement
      role: JobIAA
      time: 10800 # 3 hours
  - !type:DepartmentTimeRequirement
    department: Security
    time: 108000 # 30 hours
  startingGear: ADTInvestigatorGear
  icon: "JobIconInvestigator"
  supervisors: job-supervisors-hos
  canBeAntag: false
  access:
  - Security
  - Brig
  - Maintenance
  - Service
  - Detective

- type: startingGear
  id: ADTInvestigatorGear
  equipment:
    shoes: ClothingShoesBootsJackSecFilled
    eyes: ClothingEyesGlassesSecurity
    head: ADTClothingHeadHatsInvestigatorCap
    jumpsuit: ADTClothingUniformInvestigatorSuit
    outerClothing: ADTClothingOuterCoatInvestigator
    neck: ADTClothingNeckInvestigator
    id: InvestigatorPDA
    ears: ClothingHeadsetSecurity
    pocket1: ADTtelescopicBaton
    pocket2: ForensicScanner
    gloves: ClothingHandsGlovesForensic
