- type: entity
  id: StatueOracle
  parent: BaseStructure
  name: statue of Oracle
  description: An ancient marble statue of angel without head and limbs. It has bronze bowl in front of it. It, perhaps, should be filled with liquid?
  components:
  - type: Sprite
    noRot: true
    sprite: _DV/Structures/Decoration/statues.rsi
    state: oracle-0
    drawdepth: Mobs
    offset: "0.0,0.5"
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 1000
  - type: MixableSolution
    solution: beaker
  - type: RefillableSolution
    solution: beaker
  - type: DrainableSolution
    solution: beaker
  - type: ExaminableSolution
    solution: beaker
  - type: DrawableSolution
    solution: beaker
  - type: InjectableSolution
    solution: beaker
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    fillBaseName: oracle-

- type: entity
  id: StatueSophie
  parent: BaseStructure
  name: statue of Sophie
  description: An ancient marble statue. It represents some unknown deity. Maybe, The Science Navy knows anything about it?
  components:
  - type: Sprite
    noRot: true
    sprite: _DV/Structures/Decoration/statues.rsi
    state: sophie
    drawdepth: Mobs
    offset: "0.0,0.5"
