- type: entity
  parent: [BaseItem, RecyclableItemDeviceSmall]
  id: HandheldSecurityMonitor
  name: security monitor
  description: Displays a readout of the station's camera network.
  components:
  - type: Sprite
    sprite: Objects/Devices/tablets.rsi
    layers:
      - state: tablet
      - sprite: _NF/Objects/Devices/tablets.rsi
        state: cameras
        shader: unshaded
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
  - type: ActivatableUI
    requireActiveHand: false
    inHandsOnly: true
    key: enum.SurveillanceMonitorUiKey.Key # Lua
  - type: UserInterface
    interfaces:
      enum.SurveillanceMonitorUiKey.Key: # Lua
        type: SurveillanceMonitorWindowBoundUserInterface # Lua
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: SurveillanceCamera
    transmitFrequencyId: SurveillanceCamera
  - type: WiredNetworkConnection
  - type: SurveillanceMonitor # Lua
